<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport 设置</title>
<style>
:root {
  font: 15px Inter, "PingFang SC", system-ui, sans-serif;
  color: #f5f9fe;
  background: #0a0b0d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { max-width: 900px; margin: 0 auto; padding: 28px 20px 48px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.8px; font-weight: 650; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand svg { width: 34px; height: 34px; color: #32f08c; }
h2 { margin: 0 0 20px; font-size: 19px; font-weight: 600; }
section { padding: 24px; border: 1px solid #2c3037; border-radius: 20px; background: #14171b; }
[hidden] { display: none !important; }
nav { display: flex; gap: 6px; padding: 6px; margin-bottom: 18px; border-radius: 16px; background: #191c21; position: sticky; top: 10px; z-index: 1; }
nav button { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; padding: 12px 4px; color: #a6aab5; background: transparent; border-radius: 11px; font-size: 14px; }
nav button[aria-pressed=true] { color: #0a0b0d; background: #32f08c; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#wifi { margin-top: 28px; padding-top: 24px; border-top: 1px solid #30343b; }
#wifi summary { display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;list-style:none; }
#wifi summary::after { content:'＋';margin-left:auto;color:#32f08c; }
#wifi[open] summary::after { content:'−'; }
.optional { color:#a6aab5;font-size:12px;font-weight:400;border:1px solid #454b56;padding:3px 8px;border-radius:20px; }
#networkState { display:flex;align-items:center;gap:8px;margin-top:24px;font-size:13px;color:#a6aab5; }
#networkState::before { content:'';width:7px;height:7px;border-radius:50%;background:#666c77; }
#networkState[data-connected=true]::before { background:#32f08c; }
#wifiResult[data-error=true] { color:#ffb778; }
.network-select { display:flex;align-items:end;gap:8px; }
.network-select label { flex:1;min-width:0;margin-bottom:0; }
.network-select button { flex:0 0 58px;padding:14px 0; }
#networkHint { margin:12px 0 0;color:#a6aab5;font-size:13px; }
#connectionBanner { margin:0 0 18px;padding:12px 16px;border:1px solid #30343b;border-radius:12px;font-size:13px;color:#a6aab5; }
#connectionBanner strong { color:#32f08c;font-weight:500; }
#sessionError { padding:14px;border:1px solid #ffb778;border-radius:12px;color:#ffb778;margin-bottom:18px; }
label { display: block; margin: 16px 0; color: #a6aab5; font-size: 13px; }
input, textarea, select { font: inherit; color: #f5f9fe; }
input:not([type=file]):not([type=checkbox]):not([type=range]), textarea, select {
  width: 100%; display: block; margin-top: 7px; padding: 12px 14px;
  border: 1px solid #454b56; border-radius: 12px; background: #101216;
}

input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid #32f08c; outline-offset: 3px; }
input[type=file] { display: block; max-width: 100%; margin-top: 8px; font-size: 13px; }
input::file-selector-button {
  padding: 9px 12px; margin-right: 10px; border: 1px solid #454b56; border-radius: 9px;
  font: inherit; color: #f5f9fe; background: #23382d;
}
button {
  width: 100%; margin-top: 14px; padding: 13px 18px; border: 0; border-radius: 13px;
  background: #32f08c; color: #0a0b0d; font: inherit; font-weight: 650; cursor: pointer;
}

input[type=range] { display: block; width: 100%; margin-top: 16px; accent-color: #32f08c; }

  .editor { display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: start; }

}
@media (max-width: 380px) { body { padding: 24px 12px; } section { padding: 18px; } }
.crop-dialog { width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;border:1px solid #353a43;border-radius:24px;padding:22px;background:#14171b;color:#f5f9fe; }
.crop-dialog::backdrop { background:#000b;backdrop-filter:blur(8px); }

#cropPreview { width:auto;max-width:100%;max-height:52dvh;margin:auto;touch-action:none;cursor:grab;border-radius:12px; }
#cropPreview:active { cursor:grabbing; }

</style>
<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="2" width="18" height="20" rx="5"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M9 15h6"/></svg><h1>Passport</h1></div>

<main>

<section id="identity">
<h2>身份卡</h2>
<div class="editor">
<div class="preview"><canvas id="badge" width="240" height="280" aria-label="身份卡预览"></canvas></div>
<div class="fields">
<label>头像<input id="avatar" type="file" accept="image/*" disabled></label>
<button id="editAvatar" class="edit-crop" hidden>调整裁剪</button>
<label>主名<input id="name" maxlength="32" disabled></label>

</dialog>
<script>
const byId = id => document.getElementById(id);
const query = location.search;
const badge = byId('badge');
const photo = byId('photoPreview');
const avatar = document.createElement('canvas');
avatar.width = 112;
avatar.height = 176;
const badgeButton = byId('saveBadge');
const photoButton = byId('savePhoto'), photoInput = byId('photo');
const photoSlots = byId('photoSlots'), photoDelete = byId('deletePhoto'), photoResult = byId('photoResult');
let photoIndex = 0, photoMask = 0, photoSelected = 0, photoBusy = false, photoDraft = false;
const nameInput = byId('name'), subtitleInput = byId('subtitle');
const bioInput = byId('bio'), avatarInput = byId('avatar');
const encoder = new TextEncoder();

// 首次切到某页才加载该页，之后切换保留未保存的内容。
const panels = [['navIdentity', 'identity'], ['navPhotos', 'photos'], ['navMusic', 'music'], ['navDevice', 'device']];
for (const [button, panel] of panels) byId(button).onclick = () => {
  for (const [otherButton, otherPanel] of panels) {
    byId(otherButton).setAttribute('aria-pressed', String(otherButton === button));
    byId(otherPanel).hidden = otherPanel !== panel;
  }
  loadPanel(panel);
};

// BEGIN REQUEST QUEUE
// 响应体全部读完才释放队列：fetch 返回响应头时，图片通常仍在传输。
// 仅只读请求自动重试；保存超时可能已写入，留给用户查看结果后决定。
function createRequestQueue(fetcher, {readTimeout = 25000, writeTimeout = 30000, retryDelay = 500} = {}) {
  let tail = Promise.resolve();
  return function enqueue(url, options = {}) {
    const read = !options.method || options.method.toUpperCase() === 'GET';
    const run = async () => {
      for (let attempt = 0; ; attempt++) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), read ? readTimeout : writeTimeout);
        try {
          const response = await fetcher(url, {...options, signal:controller.signal});
          const body = await response.arrayBuffer();
          if (!response.ok) {
            const error = new Error(new TextDecoder().decode(body) || '请求失败，请重试');
            error.status = response.status;
            throw error;
          }
          // 返回内存中的响应，调用方的 json/text/arrayBuffer 不再占用设备连接。
          return new Response(response.status === 204 ? null : body, {status:response.status, headers:response.headers});
        } catch (error) {
          const interrupted = error.name === 'AbortError' || error instanceof TypeError;
          if (interrupted && read && attempt === 0) {
            await new Promise(resolve => setTimeout(resolve, retryDelay));
            continue;
          }
          if (interrupted) throw new Error(read ? '连接中断，请检查与卡片的连接后重试' : '连接中断，保存结果未确认，请查看卡片后重试');
          throw error;
        } finally { clearTimeout(timer); }
      }
    };
    const result = tail.then(run);
    tail = result.catch(() => {});
    return result;
  };
}
// END REQUEST QUEUE
const queuedRequest = createRequestQueue(fetch.bind(window));
async function request(path, options) {
  try { return await queuedRequest(path + query, options); }
  catch (error) {
    if (error.status === 403) {
      byId('sessionError').hidden = false;
      byId('sessionError').textContent = error.message;
    }
    throw error;
  }
}

function wrap(ctx, text, width, maxLines) {
  const lines = [];
  let line = '';
  for (const character of text) {
    if (character === '\n' || (line && ctx.measureText(line + character).width > width)) {
      lines.push(line);
      if (lines.length === maxLines) {
        const suffix = '…';
        let last = lines[maxLines - 1];
        while (last && ctx.measureText(last + suffix).width > width) last = Array.from(last).slice(0, -1).join('');
        lines[maxLines - 1] = last + suffix;
        return lines;
      }
      line = '';
    }
    if (character !== '\n') line += character;
  }
  if (line) lines.push(line);
  return lines;
}

function defaultAvatar() {
  const ctx = avatar.getContext('2d');
  ctx.fillStyle = '#191c21';
  ctx.fillRect(0, 0, avatar.width, avatar.height);
  ctx.strokeStyle = '#32f08c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(56, 66, 16, 0, Math.PI * 2);
  ctx.stroke();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, avatar.width, 122);
  ctx.clip();
  ctx.beginPath();
  ctx.roundRect(28, 94, 56, 56, 20);
  ctx.stroke();
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(28, 122);
  ctx.lineTo(84, 122);
  ctx.stroke();
}

function drawBadge() {
  const ctx = badge.getContext('2d');
  ctx.fillStyle = '#0a0b0d';
  ctx.fillRect(0, 0, badge.width, badge.height);
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(16, 16, 112, 176, 10);
  ctx.clip();
  ctx.drawImage(avatar, 16, 16);
  ctx.restore();

  // 三段文字从图片顶边开始排列；长文本按可用高度截断。
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#f5f9fe';
  const family = 'Inter, "PingFang SC", system-ui, sans-serif';
  const name = nameInput.value.trim() || '你的名字';
  ctx.font = '700 24px ' + family;
  if (ctx.measureText(name).width > 82) ctx.font = '700 22px ' + family;
  const nameFont = ctx.font;
  const nameLines = wrap(ctx, name, 82, 2);
  const subtitle = subtitleInput.value.trim();
  ctx.font = '600 18px ' + family;
  const subtitleLines = subtitle ? wrap(ctx, subtitle, 82, 2) : [];
  const fixedHeight = nameLines.length * 28 + (subtitleLines.length ? 16 + subtitleLines.length * 22 : 0);
  ctx.font = '14px ' + family;
  const bioLines = wrap(ctx, bioInput.value.trim(), 82, Math.min(4, Math.floor((176 - fixedHeight - 14) / 18)));
  let y = 16;
  ctx.font = nameFont;
  nameLines.forEach((line, i) => ctx.fillText(line, 142, y + i * 28 + ctx.measureText(line).actualBoundingBoxAscent));
  y += nameLines.length * 28;
  if (subtitleLines.length) {
    y += 16;
    ctx.font = '600 18px ' + family;
    ctx.fillStyle = '#32f08c';
    subtitleLines.forEach((line, i) => ctx.fillText(line, 142, y + i * 22 + ctx.measureText(line).actualBoundingBoxAscent));
    y += subtitleLines.length * 22;
  }
  ctx.font = '14px ' + family;
  ctx.fillStyle = '#a6aab5';
  bioLines.forEach((line, i) => ctx.fillText(line, 142, y + 14 + i * 18 + ctx.measureText(line).actualBoundingBoxAscent));
}

function drawCover(source, canvas) {
  const width = source.naturalWidth || source.width;
  const height = source.naturalHeight || source.height;
  const scale = Math.max(canvas.width / width, canvas.height / height);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#0a0b0d';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(source, (canvas.width - width * scale) / 2, (canvas.height - height * scale) / 2,
                width * scale, height * scale);
}

// 裁剪始终保留当前会话的原图；拖动和缩放只改变取样区域，确认时才生成一次原生像素图。
const cropDialog = byId('cropDialog'), cropPreview = byId('cropPreview'), cropZoom = byId('cropZoom');
const cropSources = new Map();
let cropState = null, cropResolve = null;
const cropPointers = new Map();
function cropRect(state) {
  const scale = Math.max(state.width / state.image.naturalWidth, state.height / state.image.naturalHeight) * state.zoom;
  const width = state.width / scale, height = state.height / scale;
  state.cx = Math.max(width / 2, Math.min(state.image.naturalWidth - width / 2, state.cx));
  state.cy = Math.max(height / 2, Math.min(state.image.naturalHeight - height / 2, state.cy));
  return {x:state.cx - width / 2, y:state.cy - height / 2, width, height};
}
function drawCrop() {
  if (!cropState) return;
  const r = cropRect(cropState), ctx = cropPreview.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

function rgb565(canvas) {
  const {width, height} = canvas;
  const rgba = canvas.getContext('2d').getImageData(0, 0, width, height).data;
  const output = new Uint8Array(width * height * 2);
  for (let p = 0, i = 0; p < rgba.length; p += 4, i += 2) {
    const word = (rgba[p] >> 3) << 11 | (rgba[p + 1] >> 2) << 5 | rgba[p + 2] >> 3;
    output[i] = word & 255;
    output[i + 1] = word >> 8;
  }
  return output;
}

function drawPixels(canvas, pixels) {
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(canvas.width, canvas.height);
  if (pixels.length !== canvas.width * canvas.height * 2) throw new Error('图片尺寸有误');
  for (let p = 0, i = 0; p < pixels.length; p += 2, i += 4) {
    const word = pixels[p] | pixels[p + 1] << 8;
    image.data[i] = Math.round((word >> 11) * 255 / 31);
    image.data[i + 1] = Math.round((word >> 5 & 63) * 255 / 63);
    image.data[i + 2] = Math.round((word & 31) * 255 / 31);
    image.data[i + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
}

async function encodePhoto(canvas) {
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.90));
  if (!blob || blob.type !== 'image/jpeg') throw new Error('无法生成 JPEG，请换一张图片');
  const data = new Uint8Array(await blob.arrayBuffer());
  if (data.length > 80 * 1024) throw new Error('照片超过 80 KiB，请调整裁剪或换图');
  return data;
}

async function drawPhoto(data) {
  if (data.length === 153600) {
    drawPixels(photo, data);
    return;
  }
  const url = URL.createObjectURL(new Blob([data], {type:'image/jpeg'}));
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    if (image.naturalWidth !== photo.width || image.naturalHeight !== photo.height)
      throw new Error('照片尺寸有误');
    photo.getContext('2d').drawImage(image, 0, 0);
  } finally { URL.revokeObjectURL(url); }
}

function crc32(bytes) {
  let crc = -1;
  for (const byte of bytes) {
    crc ^= byte;
    for (let bit = 0; bit < 8; ++bit) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
  }
  return ((~crc) >>> 0).toString(16).padStart(8, '0');
}

async function sendImage(path, data, fields = {}) {

  return response.text();
}

function encodeImage(data) {

    binary += String.fromCharCode(...data.subarray(start, start + 8192));
  return {data:btoa(binary), crc32:crc32(data)};
}

function decodeImage(image, sizes, jpegLimit = 0) {
  if (typeof image?.data !== 'string' || typeof image.crc32 !== 'string') throw new Error('图片格式有误');
  const data = Uint8Array.from(atob(image.data), c => c.charCodeAt(0));
  const jpeg = data.length >= 24 && data.length <= jpegLimit && data[0] === 255 && data[1] === 216 &&
    data[data.length - 2] === 255 && data[data.length - 1] === 217;
  if ((!sizes.includes(data.length) && !jpeg) || crc32(data) !== image.crc32)
    throw new Error('图片尺寸或校验值有误');
  return data;
}

  if (!Array.isArray(photos) || photos.length !== (value.version === 1 ? 3 : 6) ||
      !Number.isInteger(selectedPhoto) || selectedPhoto < 0 || selectedPhoto >= photos.length ||
      (photos.some(Boolean) && !photos[selectedPhoto]))
    throw new Error('备份的相册目录有误');
  if (identity !== null) {
    for (const [field, limit] of [['name',96], ['subtitle',120], ['bio',240]]) {
      const text = identity?.[field];
      if (typeof text !== 'string' || /[\u0000-\u0009\u000b-\u001f\u007f]/.test(text) ||
          encoder.encode(text).length > limit)
        throw new Error('备份的身份卡文字有误');
      encodeURIComponent(text); // 确认文字可原样写回固件的 UTF-8 请求头。
    }
  }
  if (typeof music?.enabled !== 'boolean' || ![0,1,2,3].includes(music.selection) ||
      typeof music.custom !== 'string' || music.custom.includes('\0') || encoder.encode(music.custom).length > 1024)
    throw new Error('备份的音乐设置有误');
  if (!Number.isInteger(device?.brightness) || device.brightness < 10 || device.brightness > 100 ||
      !Number.isInteger(device?.volume) || device.volume < 0 || device.volume > 100 ||
      ![0,30,60,180,300].includes(device?.sleepSeconds) || ![0,1].includes(device?.powerMode) ||
      ![300,900,1800].includes(device?.deepSleepSeconds))
    throw new Error('备份的显示设置有误');
  return {
    identity:identity === null ? null : {...identity, image:decodeImage(identity.image, [147200, 173824])},
    photos:Array.from({length:6}, (_, i) => photos[i] == null ? null :
      decodeImage(photos[i], [153600], value.version === 2 ? 80 * 1024 : 0)),
    selectedPhoto,
    music:{enabled:music.enabled, selection:music.selection, custom:music.custom},
    device:Object.fromEntries(deviceKeys.map(key => [key, device[key]]))
  };
}

async function backupAction(action) {
  if (backupBusy) return;
  backupBusy = true;
  for (const id of backupControls) byId(id).disabled = true;
  try { await action(); }
  catch (error) { backupOutput.textContent = error.message || '操作失败，请重试'; }
  finally {
    backupBusy = false;
    for (const id of backupControls) byId(id).disabled = false;
  }
}

async function readBackupAsset(path, options) {
  return encodeImage(new Uint8Array(await (await request(path, options)).arrayBuffer()));
}

byId('openBackup').onclick = () => {
  if (backupDialog.open) return;
  pendingBackup = null;
  backupOutput.textContent = '';
  restoreButton.hidden = true;
  backupDialog.showModal();
};
byId('closeBackup').onclick = () => backupDialog.close();
backupDialog.oncancel = event => { if (backupBusy) event.preventDefault(); };

byId('exportBackup').onclick = () => backupAction(async () => {
  backupOutput.textContent = '正在读取卡片…';
  const profile = await (await request('/profile')).json();
  const music = await (await request('/music')).json();
  const device = await (await request('/device')).json();
  const identity = profile.avatar ? {
    name:profile.name, subtitle:profile.subtitle, bio:profile.bio,
    image:await readBackupAsset('/badge')
  } : null;
  const photos = Array(profile.photoCapacity).fill(null);
  for (let i = 0; i < photos.length; ++i)
    if (profile.photoMask & (1 << i)) photos[i] = await readBackupAsset('/photo', {headers:photoHeaders(i)});
  const value = {
    format:'folotoy-passport', version:2, exportedAt:new Date().toISOString(),
    identity, photos, selectedPhoto:profile.photoSelected,
    music:{enabled:music.enabled, selection:music.selection, custom:music.custom},
    device:Object.fromEntries(deviceKeys.map(key => [key, device[key]]))
  };
  validateBackup(value);
  const text = JSON.stringify(value);
  const filename = 'Passport-' + value.exportedAt.slice(0,10) + '.json';
  if (window.webkit?.messageHandlers?.passportBackup) {
    window.webkit.messageHandlers.passportBackup.postMessage({filename, text});
    return;
  }
  const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  const download = document.createElement('a');
  download.href = url;
  download.download = filename;
  document.body.append(download);
  download.click();
  download.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  backupOutput.textContent = '备份文件已生成';
});

byId('chooseBackup').onclick = () => backupFile.click();
backupFile.onchange = () => {
  const file = backupFile.files[0];
  backupFile.value = '';
  if (!file) return;
  pendingBackup = null;
  restoreButton.hidden = true;
  return backupAction(async () => {
    if (file.size > 1200000) throw new Error('备份文件超过大小限制');
    const backup = validateBackup(JSON.parse(await file.text()));
    const canvas = document.createElement('canvas');
    canvas.width = photo.width;
    canvas.height = photo.height;
    for (let i = 0; i < backup.photos.length; ++i) {
      if (backup.photos[i]?.length !== 153600) continue;
      drawPixels(canvas, backup.photos[i]);
      backup.photos[i] = await encodePhoto(canvas);
    }
    pendingBackup = backup;
    restoreButton.hidden = false;
    backupOutput.textContent = file.name + ' · 恢复会覆盖卡片现有资料';
  });
};

function backupJSON(value) {
  return {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(value)};
}

restoreButton.onclick = () => backupAction(async () => {
  const {identity, photos, selectedPhoto, music, device} = pendingBackup;
  backupOutput.textContent = '正在校验乐谱…';
  await request('/music/check', backupJSON(music));
  async function restoreItem(name, action) {
    backupOutput.textContent = '正在恢复' + name + '…';
    try { await action(); }
    catch (error) { throw new Error(name + '恢复中断。之前已保存的项目保留。' + error.message); }
  }
  try {
    if (identity) await restoreItem('身份卡', () => sendImage('/badge', identity.image, {
      'X-Badge-Name':'.' + encodeURIComponent(identity.name),
      'X-Badge-Subtitle':'.' + encodeURIComponent(identity.subtitle),
      'X-Badge-Bio':'.' + encodeURIComponent(identity.bio)
    }));
    for (const [i, image] of photos.entries())
      if (image) await restoreItem('照片 ' + (i + 1), () => sendImage('/photo', image, photoHeaders(i)));
    await restoreItem('音乐', () => request('/music', backupJSON(music)));
    await restoreItem('显示设置', () => request('/device', backupJSON(device)));
    if (!identity) await restoreItem('空白身份卡', () => request('/badge', {method:'DELETE'}));
    for (const [i, image] of photos.entries())
      if (!image) await restoreItem('空白照片位 ' + (i + 1), () => request('/photo', {method:'DELETE', headers:photoHeaders(i)}));
    if (photos[selectedPhoto])
      await restoreItem('展示照片', () => request('/photo/select', {method:'POST', headers:photoHeaders(selectedPhoto)}));
    pendingBackup = null;
    restoreButton.hidden = true;
    backupOutput.textContent = '已恢复到卡片';
  } finally {
    profileRequest = null;
    panelLoads.clear();
    loadPanel('device');
  }
});


const panelLoads = new Map();
const panelConfig = {
  identity:['badge', initializeIdentity], photos:['photo', initializePhotos],
  music:['music', initializeMusic], device:['device', initializeDevice]
};
function loadPanel(panel) {
  if (panelLoads.has(panel)) return panelLoads.get(panel);
  const [prefix, initialize] = panelConfig[panel];
  const output = byId(prefix + 'Result'), retry = byId(prefix + 'Retry');
  output.textContent = '正在读取…'; retry.hidden = true;
  const pending = initialize().then(() => { output.textContent = ''; }).catch(error => {
    console.error('Failed to load settings panel:', panel, error);
    output.textContent = error.message;
    retry.hidden = error.status === 403;
    panelLoads.delete(panel);
  });
  panelLoads.set(panel, pending);
  return pending;
}
for (const [panel, [prefix]] of Object.entries(panelConfig)) byId(prefix + 'Retry').onclick = () => loadPanel(panel);
defaultAvatar();
drawBadge();
loadPanel('identity').then(() => {
  const now = new Date();
  request('/time', {method:'POST', headers:{
    'X-Clock-Epoch':String(Math.floor(now.getTime() / 1000)),
    'X-Clock-Offset':String(-now.getTimezoneOffset())
  }}).catch(error => console.warn('Clock sync:', error.message));
});
</script>
